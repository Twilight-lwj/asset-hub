    + '<label class="fitem"><span class="flab">第三方应用密码</span><input id="nsPass" type="password" autocomplete="off"></label>'
    + '<label class="fitem"><span class="flab">远程目录</span><input id="nsPath" type="text"></label>'
    + '<label class="fitem"><span class="flab">保留份数</span><input id="nsKeep" type="number" min="1" max="99"></label>'
    + '</div><div class="set-btns">'
    + '<button class="bx" data-ns="save">保存配置</button>'
    + '<button class="bx" data-ns="test">测试连接</button>'
    + '<button class="bx" data-ns="up">立即备份</button>'
    + '<button class="bx" data-ns="down">从云端恢复</button>'
    + '</div><div class="ns-status" id="nsStatus"></div>'
    + '<p class="set-tip">需使用坚果云「第三方应用密码」，登录密码会鉴权失败。浏览器直接打开时请用上方的导出 / 导入。</p></div>';
  $('settingsBody').innerHTML = html;
  $('nsUser').value = NS.user || '';
  $('nsPass').value = NS.pass || '';
  $('nsPath').value = NS.path || NS_DIR;
  $('nsKeep').value = String(NS.keep || 30);
  $('nsStatus').textContent = NS.status || '';
}
function openSettings(){
  closeRestorePicker();
  forceWhiteBarsSoon();
  closeSheet(); closeAccount();
  clearArmed = false;
  renderSettings();
  $('settings').classList.add('on');
  $('settingsMask').classList.add('on');
}
function closeSettings(){
  forceWhiteBarsSoon();
  $('settings').classList.remove('on');
  $('settingsMask').classList.remove('on');
}
function refreshAddOptions(){
  fillSelect('fCategory', DB.categories[S_ADD.type] || []);
  fillSelect('fTag', DB.tags[S_ADD.type] || []);
}

/* ---- 事件绑定 ---- */
/* v1.1.7：5 个原生 select 的点击统一接到紧凑弹层；选中后写回并派发 change */
document.addEventListener('click', e => {
  const hit = e.target.closest('.sel-hit');
  if(hit){ openPicker($(hit.dataset.sel), hit.dataset.title); return; }
  const row = e.target.closest('.picker-row');
  if(row && PICK_SEL){
    const sel = PICK_SEL, v = row.dataset.v;
    closePicker();
    sel.value = v;
    sel.dispatchEvent(new Event('change', {bubbles:true}));
  }
});
$('pickerClose').addEventListener('click', closePicker);
$('pickerMask').addEventListener('click', closePicker);
$('prevDay').addEventListener('click', () => setDate(shiftDate(S.date, -1)));
$('nextDay').addEventListener('click', () => setDate(shiftDate(S.date, 1)));
$('prevMon').addEventListener('click', () => setMonth(shiftMonth(S.month, -1)));
$('nextMon').addEventListener('click', () => setMonth(shiftMonth(S.month, 1)));
$('dateLabel').addEventListener('click', () => {
  const p = $('datePicker');
  try { p.showPicker(); }
  catch(e) { p.focus(); p.click(); }
});
$('datePicker').addEventListener('change', e => { if(e.target.value) setDate(e.target.value); });
document.addEventListener('keydown', e => {
  if(pickerOpen()){ if(e.key === 'Escape') closePicker(); return; }
  if(restoreOpen()){ if(e.key === 'Escape') closeRestorePicker(); return; }
  if(acctOpen()){ if(e.key === 'Escape') closeAccount(); return; }
  if(settingsOpen()){
    if(e.key === 'Escape') closeSettings();
    return;
  }
  if(sheetOpen()){
    if(e.key === 'Escape'){ closeSheet(); return; }
    /* v1.3.2：Linux / 桌面端物理键盘直接敲金额（手机端无物理键盘，行为零变化） */
    handleSheetKey(e);
    return;
  }
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.key === 'ArrowLeft')  setDate(shiftDate(S.date, -1));
  if(e.key === 'ArrowRight') setDate(shiftDate(S.date, 1));
});
/* v1.3.7：dock 第一项「总览」—— 开屏页，点了回到总览（日历与日期条隐藏，不涉及日期）
   v1.4.0：总览只有一页，点「总览」就是重渲这一页，没有子页状态需要复位。 */
$('tabOv').addEventListener('click', () => { if(Date.now() < HL_SUPPRESS) return; S.tab = 'overview'; renderFlow(); });
$('tabBill').addEventListener('click', () => { if(Date.now() < HL_SUPPRESS) return; S.tab = 'bill'; renderFlow(); });
/* v1.2.8：长按「资产」＝清除全部高亮；长按后紧跟的那次 click 不再切页 */
$('tabAsset').addEventListener('click', () => { if(Date.now() < HL_SUPPRESS) return; S.tab = 'asset'; renderFlow(); });
$('btnAdd').addEventListener('click', openSheet);
/* 9. v1.1.6：顶部「备份」固定备份区 + 坚果云双写（零弹窗）；「恢复」先弹来源选择框 */
$('btnTheme').addEventListener('click', toggleTheme);
$('btnBackup').addEventListener('click', backupAll);
$('btnRestore').addEventListener('click', openRestorePicker);
/* v1.4.3：顶栏第六格 —— 三页都可用，与资产页原来的「+ 新增账户」同一入口 */
$('btnAddAccount').addEventListener('click', () => openAccount(null));
$('restoreClose').addEventListener('click', closeRestorePicker);
$('restoreMask').addEventListener('click', closeRestorePicker);
$('restoreBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-restore]');
  if(!b) return;
  closeRestorePicker();
  if(b.dataset.restore === 'local') restoreFromLocal();
  else restoreFromCloud();
});
$('importFile').addEventListener('change', e => {
  importBackup(e.target.files && e.target.files[0]);
  e.target.value = '';
});
/* ---------- v1.2.8：资产页两类账户「长按高亮」----------
   v1.2.7 的「长按拖拽排序」按用户要求整体移除，长按改为对账标记：
     · 长按账户行 450ms → 该账户高亮；再长按一次取消（白天 / 黑夜都用中灰 #999）；
     · 长按底部「资产」按钮 → 一次性清除全部高亮；
     · 标记写进数据 DB.settings.acctHl（账户 id 数组，沿用既有约定 v1.1.14 的键名），
       跟着本地备份与坚果云备份一起走 —— 换设备 / 恢复备份后原样保留；
     · 只影响显示：余额、合计、汇总、导出文件都不因高亮发生任何数值变化；
     · 轻点（未满 450ms）仍是旧行为：打开「修改账户」；长按后紧跟的那次 click 被抑制。 */
const HL_HOLD_MS = 450;
const HL_TOL = 8;
const HL = {timer:null, x:0, y:0};
let HL_SUPPRESS = 0;

function hlIds(){
  if(!DB.settings || typeof DB.settings !== 'object') DB.settings = {};
  if(!Array.isArray(DB.settings.acctHl)) DB.settings.acctHl = [];
  return DB.settings.acctHl;
}
const isHl = id => hlIds().indexOf(id) >= 0;
function hlSaved(){ persistDB(); renderFlow(); }
function toggleHl(id){
  if(!id) return;
  const arr = hlIds();
  const i = arr.indexOf(id);
  if(i >= 0) arr.splice(i, 1); else arr.push(id);
  hlSaved();
  toast(i >= 0 ? '已取消这个账户的高亮' : '已高亮 ' + arr.length + ' 个账户');
}
function clearHl(){
  const arr = hlIds();
  if(!arr.length){ toast('当前没有高亮的账户'); return; }
  const cnt = arr.length;
  arr.length = 0;
  hlSaved();
  toast('已清除 ' + cnt + ' 个账户的高亮');
}
function hlReset(){ if(HL.timer){ clearTimeout(HL.timer); HL.timer = null; } }
/* 长按计时：抬起、或计时内移动超过 8px（当滑动处理）都取消，轻点路径零变化 */
function hlArm(e, fire){
  if(e.button) return;                       /* 只认左键 / 触摸 */
  hlReset();
  HL.x = e.clientX; HL.y = e.clientY;
  HL.timer = setTimeout(() => { HL.timer = null; HL_SUPPRESS = Date.now() + 500; fire(); }, HL_HOLD_MS);
}
$('flow').addEventListener('pointerdown', e => {
  const el = e.target.closest('.asset-item[data-acct]');
  if(!el) return;
  hlArm(e, () => toggleHl(el.dataset.acct));
});
$('tabAsset').addEventListener('pointerdown', e => hlArm(e, clearHl));
document.addEventListener('pointermove', e => {
  if(!HL.timer) return;
  if(Math.abs(e.clientX - HL.x) > HL_TOL || Math.abs(e.clientY - HL.y) > HL_TOL) hlReset();
}, {passive:true});
document.addEventListener('pointerup', hlReset);
document.addEventListener('pointercancel', hlReset);

/* 账单页流水条点击修改 / 删除；资产页账户行点击修改
   （v1.4.3 起「+ 新增账户」在顶栏，不再走这里的委托） */
$('flow').addEventListener('click', e => {
  if(Date.now() < HL_SUPPRESS){ e.preventDefault(); e.stopPropagation(); return; }
  /* v1.4.0：总览页没有任何可点元素 —— 三块本年网格纯展示，
     故这里不再有入口卡与返回键两条分支（v1.3.9 的它们已整块删除）。 */
  const acc = e.target.closest('[data-acct]');
  if(acc){ openAccount(acc.dataset.acct); return; }
  const row = e.target.closest('.flow-row[data-id]');
  if(row) openEdit(row.dataset.id);
});
$('delYes').addEventListener('click', deleteTx);
$('delNo').addEventListener('click', hideDelConfirm);
/* 账户弹层 */
$('acctClose').addEventListener('click', closeAccount);
$('acctMask').addEventListener('click', closeAccount);
$('aCancel').addEventListener('click', closeAccount);
$('aKind').addEventListener('change', syncAcctLimit);
$('aSave').addEventListener('click', saveAccount);
$('aDel').addEventListener('click', deleteAccount);
/* 设置页：分类标签增删改 + 数据 + 坚果云 */
$('btnSettings').addEventListener('click', openSettings);
$('settingsClose').addEventListener('click', closeSettings);
$('settingsMask').addEventListener('click', closeSettings);
$('settingsBody').addEventListener('click', e => {
  const io = e.target.closest('[data-io]');
  if(io){
    const k = io.dataset.io;
    if(k === 'export') exportBackup();
    else if(k === 'import') $('importFile').click();
    else if(k === 'clear'){ clearAllData(); renderSettings(); }
    return;
  }
  const ns = e.target.closest('[data-ns]');
  if(ns){
    const k = ns.dataset.ns;
    if(k === 'save') nsSaveCfg();
    else if(k === 'test') nsTest();
    else if(k === 'up') nsUpload();
    else if(k === 'down') nsDownload();
    return;
  }
  const grp = e.target.closest('.set-group');
  if(!grp) return;
  const key = grp.dataset.key, tp = grp.dataset.type;
  const list = DB[key][tp] || (DB[key][tp] = []);
  const del = e.target.closest('[data-del]');
  const add = e.target.closest('[data-add]');
  if(del) list.splice(Number(del.dataset.del), 1);
  else if(add){
    const inp = grp.querySelector('[data-new]');
    const v = inp.value.trim();
    if(!v){ toast('请先输入名称'); return; }
    if(list.includes(v)){ toast('「' + v + '」已存在'); return; }
    list.push(v);
  }
  else return;
  persistDB();
  renderSettings();
  refreshAddOptions();
});
$('settingsBody').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const inp = e.target.closest('[data-new]');
  if(!inp) return;
  e.preventDefault();
  const btn = inp.closest('.set-group').querySelector('[data-add]');
  if(btn) btn.click();
});
$('fDateBtn').addEventListener('click', () => {
  const d = $('fDate');
  try { d.showPicker(); } catch(e) { d.focus(); d.click(); }
});
$('fDate').addEventListener('change', e => {
  if(e.target.value) $('fDateBtn').textContent = dateLabel(e.target.value);
});
$('fNoCount').addEventListener('change', updateNoCountBox);
$('sheetClose').addEventListener('click', closeSheet);
$('sheetMask').addEventListener('click', closeSheet);
$('typeRow').addEventListener('click', e => {
  const b = e.target.closest('[data-type]');
  if(b) setAddType(b.dataset.type);
});
$('fieldGrid').addEventListener('click', e => {
  const f = e.target.closest('.keypad-field');
  if(f) setActiveField(f);
});
/* v1.3.2：键盘 Tab / 点击聚焦到哪一格，物理键盘就写进哪一格（桌面端 Tab 切换金额字段） */
document.querySelectorAll('.keypad-field').forEach(el => {
  el.addEventListener('focus', () => setActiveField(el));
});
$('numpad').addEventListener('click', e => {
  const b = e.target.closest('[data-key]');
  if(b) keyInput(b.dataset.key);
});
$('opcol').addEventListener('click', e => {
  const op = e.target.closest('[data-op]');
  if(op){ keyInput(op.dataset.op); return; }
  if(e.target.closest('#btnAgain')){
    if(S_ADD.mode === 'edit') showDelConfirm();
    else saveTx(true);
  }
  else if(e.target.closest('#btnSave')){
    if(S_ADD.mode === 'edit') saveEdit();
    else saveTx(false);
  }
});

/* 启动句放在所有 const / 函数声明之后，避免 TDZ 造成整块脚本中断 */
/* v1.1.6：同步 meta / 按钮态 / 系统栏颜色；默认亮色分支与 v1.1.5 完全一致 */
applyTheme(isDark(), false);
[120, 400, 1000].forEach(ms => setTimeout(forceWhiteBars, ms));
['pageshow', 'focus', 'resize'].forEach(ev => window.addEventListener(ev, forceWhiteBars));
document.addEventListener('visibilitychange', () => { if(!document.hidden) forceWhiteBars(); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', forceWhiteBars);
/* v1.2.8：竖屏资产页的滚动兜底在视口变化后要重新判定（fitAssetScroll 已在 renderFlow 段注册） */
renderAll();
fitFrame();
</script>
